<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Simple Test</title>
<style>
body { font-family: sans-serif; padding: 20px; }
#input { width: 100%; height: 100px; }
#loading { display: none; color: blue; }
#result { display: none; margin-top: 20px; padding: 10px; background: #f0f0f0; }
</style>
</head>
<body>
<h2>AI 岗位匹配器 - 简化测试</h2>
<textarea id="input" placeholder="粘贴JD内容">UI设计师，2年经验，精通Figma，有B端产品设计经验</textarea>
<br><br>
<button onclick="startMatch()">开始匹配</button>
<div id="loading">AI 正在分析匹配度...</div>
<div id="result"></div>

<script>
// 简化的简历数据
const resumeData = {
  workExperience: {
    years: "2年+",
    role: "Product Designer",
    projects: [
      { name: "后台重构", evidence: "SKU创建耗时从80s降至40s" },
      { name: "Design System", evidence: "模板使用率从0提升至90%" }
    ],
    tools: ["Figma", "Sketch"],
    scenarios: ["B端SaaS", "后台系统"]
  }
};

function startMatch() {
  console.log("startMatch called");
  var jd = document.getElementById("input").value.trim();
  if (!jd) {
    alert("请输入JD");
    return;
  }
  
  document.getElementById("loading").style.display = "block";
  document.getElementById("result").style.display = "none";
  
  setTimeout(function() {
    console.log("timeout fired");
    try {
      var result = generateMatchResult(jd);
      console.log("result:", result);
      document.getElementById("result").innerHTML = 
        "<h3>匹配结果</h3>" +
        "<p>综合评分: " + result.overallScore + "分</p>" +
        "<p>匹配等级: " + result.overallLevel + "</p>" +
        "<p>亮点: " + result.highlights.length + "条</p>" +
        "<p>总结: " + result.summary + "</p>";
      document.getElementById("result").style.display = "block";
    } catch (e) {
      console.error("Error:", e);
      document.getElementById("result").innerHTML = "<p style='color:red'>错误: " + e.message + "</p>";
      document.getElementById("result").style.display = "block";
    }
    document.getElementById("loading").style.display = "none";
  }, 1000);
}

function generateMatchResult(jd) {
  console.log("generateMatchResult called");
  
  // 简化版：直接计算匹配度
  var score = 50;
  var jdLower = jd.toLowerCase();
  
  // 关键词匹配
  if (jdLower.indexOf("figma") >= 0 || jdLower.indexOf("设计") >= 0) score += 15;
  if (jdLower.indexOf("b端") >= 0 || jdLower.indexOf("saas") >= 0) score += 15;
  if (jdLower.indexOf("2年") >= 0 || jdLower.indexOf("经验") >= 0) score += 10;
  
  score = Math.min(score, 95);
  
  var level = score >= 85 ? "高度匹配" : score >= 70 ? "较为匹配" : score >= 55 ? "基本匹配" : "匹配度较低";
  
  return {
    overallScore: score,
    overallLevel: level,
    highlights: [{jdRequirement: "设计经验", resumeEvidence: "2年B端产品设计经验"}],
    summary: "候选人" + level + "（" + score + "分），具备B端SaaS产品设计经验。"
  };
}

// 自动触发测试
window.onload = function() {
  console.log("page loaded");
};
</script>
</body>
</html>
