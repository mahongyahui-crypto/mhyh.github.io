<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 岗位匹配器 · 马弘雅卉</title>
<meta name="description" content="AI驱动的岗位匹配分析工具，基于马弘雅卉的简历智能评估与职位的匹配度。" />
<link rel="stylesheet" href="style.css" />
<style>
/* 匹配器专用样式 */
.matcher-section {
  min-height: 100vh;
  padding: 120px 0 80px;
  background: var(--bg);
}
.matcher-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px;
}
.matcher-header {
  text-align: center;
  margin-bottom: 48px;
}
.matcher-header h1 {
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 800;
  color: var(--ink-1);
  margin-bottom: 12px;
}
.matcher-header p {
  font-size: 16px;
  color: var(--ink-2);
}
.matcher-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.matcher-card h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.matcher-card h3::before {
  content: '';
  width: 4px;
  height: 20px;
  background: var(--accent);
  border-radius: 99px;
}
.jd-input {
  width: 100%;
  min-height: 180px;
  padding: 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.8;
  color: var(--ink-1);
  background: var(--bg);
  resize: vertical;
  transition: border-color .2s;
  font-family: inherit;
}
.jd-input:focus {
  outline: none;
  border-color: var(--primary-light);
}
.jd-input::placeholder {
  color: var(--ink-3);
}
.matcher-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn-matcher {
  padding: 14px 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 8px 28px rgba(27,58,107,.28);
}
.btn-matcher:hover:not(:disabled) {
  background: var(--primary-light);
  transform: translateY(-2px);
  box-shadow: 0 12px 36px rgba(27,58,107,.34);
}
.btn-matcher:disabled {
  opacity: .6;
  cursor: not-allowed;
}
.btn-secondary {
  padding: 14px 24px;
  background: var(--bg);
  color: var(--ink-1);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.btn-secondary:hover {
  border-color: var(--primary-light);
  color: var(--primary);
}
/* 加载动画 */
.loading {
  display: none;
  text-align: center;
  padding: 40px;
}
.loading.show { display: block; }
.loading-spinner {
  width: 48px;
  height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* 结果卡片 */
.result-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow);
  margin-top: 32px;
  display: none;
}
.result-card.show {
  display: block;
  animation: slideUp .5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 总分区 */
.result-top {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 32px;
  margin-bottom: 32px;
  align-items: start;
}
@media (max-width: 640px) {
  .result-top { grid-template-columns: 1fr; }
}
.score-section {
  text-align: center;
  padding: 24px;
  background: var(--bg-alt);
  border-radius: var(--radius);
}
.score-big {
  font-size: 64px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
  letter-spacing: -2px;
}
.score-label {
  font-size: 14px;
  color: var(--ink-3);
  margin-top: 8px;
  font-weight: 500;
}
.score-status {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  margin-top: 12px;
}
.score-status.high { background: #dcfce7; color: #166534; }
.score-status.medium { background: #fef3c7; color: #92400e; }
.score-status.low { background: #fee2e2; color: #991b1b; }
/* 维度评分 */
.dimensions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.dimension-item {
  background: var(--bg-alt);
  padding: 16px;
  border-radius: 8px;
}
.dimension-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.dimension-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-1);
}
.dimension-score {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
}
.dimension-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.dimension-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 3px;
  transition: width 1s ease;
}
/* 亮点和总结 */
.result-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.result-section h4 {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 12px;
}
.highlight-list {
  list-style: none;
}
.highlight-list li {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.8;
  padding: 8px 0;
  padding-left: 24px;
  position: relative;
}
.highlight-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--primary);
  font-weight: 700;
}
.summary-text {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.8;
  background: var(--bg-alt);
  padding: 16px;
  border-radius: 8px;
}
/* 关键词 */
.keyword-section {
  margin-top: 24px;
}
.keyword-section h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-1);
  margin-bottom: 10px;
}
.keyword-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.keyword-tag {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}
.keyword-tag.matched { background: #dcfce7; color: #166534; }
.keyword-tag.missing { background: #fee2e2; color: #991b1b; }
/* API Key 输入 */
.api-key-section {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.api-key-section label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  margin-bottom: 8px;
}
.api-key-input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: monospace;
  background: var(--bg);
  color: var(--ink-1);
}
.api-key-input:focus {
  outline: none;
  border-color: var(--primary-light);
}
.api-key-note {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 6px;
}
/* 导出按钮 */
.export-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.btn-export {
  padding: 10px 20px;
  background: var(--bg-alt);
  color: var(--ink-1);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.btn-export:hover {
  border-color: var(--primary-light);
  color: var(--primary);
  background: var(--bg);
}
</style>
</head>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">MH</a>
    <div class="nav-links">
      <a href="index.html#about" class="nav-link">关于我</a>
      <a href="index.html#experience" class="nav-link">工作经历</a>
      <a href="index.html#skills" class="nav-link">技能特长</a>
      <a href="index.html#projects" class="nav-link">项目经验</a>

    </div>
  </div>
</nav>

<!-- MATCHER SECTION -->
<section class="matcher-section">
  <div class="matcher-container">
    <div class="matcher-header fade-up">
      <h1>AI 岗位匹配器</h1>
      <p>粘贴职位描述，AI 将智能分析简历与岗位的匹配度</p>
    </div>

    <!-- 输入区 -->
    <div class="matcher-card fade-up delay-1">
      <h3>粘贴职位描述（JD）</h3>
      <textarea 
        class="jd-input" 
        id="jdInput" 
        placeholder="请在此粘贴完整的职位描述...

例如：
职位：UI/UX设计师

岗位职责：
1. 负责B端SaaS产品的UI/UX设计

任职要求：

2. 精通Figma、Sketch等设计工具
3. 有B端产品设计经验"></textarea>

      <div class="matcher-actions">

    <!-- 结果卡片 -->
    <div class="result-card" id="resultCard">
      <!-- 导出按钮 -->
      <div class="export-actions">
        <button class="btn-export" onclick="exportAsImage()">导出为图片</button>
        <button class="btn-export" onclick="exportAsPDF()">导出为PDF</button>
        <button class="btn-export" onclick="copyReport()">复制报告</button>
      </div>

      <div class="result-top">
        <!-- 总分 -->
        <div class="score-section">
          <div class="score-big" id="totalScore">--</div>
          <div class="score-label">匹配度总分</div>
          <span class="score-status" id="scoreStatus">--</span>
        </div>
        <!-- 维度评分 -->
        <div class="dimensions-grid" id="dimensionsGrid">

        </div>

      <!-- 匹配亮点 -->
      <div class="result-section">

        </ul>

      <!-- 匹配总结 -->
      <div class="result-section">

      <!-- 关键词匹配 -->
      <div class="keyword-section">

        </div>

<!-- 返回顶部 -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:32px;right:32px;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;cursor:pointer;opacity:0;transform:translateY(20px);transition:all .3s;z-index:900;">↑</button>

<script>
// 简历数据
const resumeData = {
  name: "马弘雅卉",
  title: "Product Designer · B端 SaaS",
  skills: ["Figma", "Sketch", "UI设计", "UX设计", "Photoshop", "Illustrator", "After Effects", "交互设计", "原型设计", "Design System", "组件库", "设计规范", "信息架构", "用户研究"],
  domains: ["B端", "SaaS", "后台系统", "连锁门店", "企业管理系统"],
  experience: ["后台框架重构", "Design System建设", "信息架构设计", "跨部门协作", "需求分析", "业务流程优化", "数据驱动设计", "组件化设计"],
  culture: ["沟通能力", "责任心", "逻辑思维", "抗压能力", "场景化思维", "系统化设计"]
};

// 示例 JD
const demoJD = `职位：UI/UX设计师

岗位职责：
1. 负责B端SaaS产品的UI/UX设计，把控设计质量
2. 建立和维护Design System，统一产品设计规范
3. 与产品、开发团队紧密协作，推动设计落地
4. 关注用户体验，持续优化产品交互

任职要求：
1. 2年以上UI/UX设计经验
2. 精通Figma、Sketch等设计工具
3. 有B端产品设计经验，熟悉后台系统交互逻辑
4. 具备良好的沟通能力和跨部门协作能力
5. 有Design System建设经验优先`;

// 加载示例
function loadDemo() {
  document.getElementById('jdInput').value = demoJD;
}

// 清空
function clearAll() {
  document.getElementById('jdInput').value = '';
  document.getElementById('apiKey').value = '';
  document.getElementById('resultCard').classList.remove('show');
}

// 分析匹配
async function analyzeMatch() {
  const jd = document.getElementById('jdInput').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  
  if (!jd) {
    alert('请输入职位描述');
    return;
  }

  document.getElementById('loading').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('analyzeBtn').disabled = true;

  try {
    let result;
    if (apiKey) {
      result = await callOpenAI(jd, apiKey);
    } else {
      await new Promise(r => setTimeout(r, 1500));
      result = generateMockResult(jd);
    }
    displayResult(result);
  } catch (err) {
    alert('分析出错：' + err.message);
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

// 调用 OpenAI API
async function callOpenAI(jd, apiKey) {
  const prompt = `你是一位专业的HR岗位匹配分析师。请基于以下候选人简历信息和职位描述，进行匹配度分析。

【候选人简历】
姓名：马弘雅卉
职位：Product Designer（B端 SaaS 产品设计师）
工作经验：2年+ B端产品设计经验

核心技能：Figma, Sketch, Photoshop, Illustrator, After Effects, 交互设计, 原型设计, Design System建设, 信息架构设计, 用户研究

工作经历：B端 SaaS 产品设计师（2022-至今），主导后台基础框架重构项目，建设 Design System，将 SKU 创建耗时从 80s 降至 40s，配置错误率从 88% 降至 40%，模板使用率从 0 提升至 90%。

【职位描述】
${jd}

请输出JSON格式的分析结果：
{
  "totalScore": 85,
  "dimensions": {"skill": 88, "experience": 85, "industry": 82, "culture": 85},
  "highlights": ["亮点1", "亮点2", "亮点3"],
  "summary": "总结内容",
  "matchedKeywords": ["关键词1", "关键词2"],
  "missingKeywords": ["关键词3", "关键词4"]
}`;

  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7
    })
  });

  if (!response.ok) throw new Error('API请求失败');
  const data = await response.json();
  const content = data.choices[0].message.content;
  const jsonMatch = content.match(/\{[\s\S]*\}/);
  if (jsonMatch) return JSON.parse(jsonMatch[0]);
  throw new Error('无法解析AI响应');
}

// 生成模拟结果
function generateMockResult(jd) {
  const jdLower = jd.toLowerCase();
  
  // 关键词匹配
  const allKeywords = [...resumeData.skills, ...resumeData.domains, ...resumeData.experience];
  const matched = [];
  const missing = [];
  
  allKeywords.forEach(kw => {
    if (jdLower.includes(kw.toLowerCase())) {
      matched.push(kw);
    }
  });
  
  // 补充一些可能缺失的关键词
  if (jdLower.includes('管理') && !matched.includes('团队管理')) missing.push('团队管理经验');
  if (jdLower.includes('3年') || jdLower.includes('3+')) missing.push('3年以上经验');
  if (jdLower.includes('前端') || jdLower.includes('开发')) missing.push('前端开发能力');
  
  // 计算分数
  const matchRatio = matched.length / Math.max(allKeywords.length * 0.3, 5);
  const baseScore = Math.min(70 + matchRatio * 30, 95);
  
  return {
    totalScore: Math.round(baseScore),
    dimensions: {
      skill: Math.round(baseScore + Math.random() * 10 - 5),
      experience: Math.round(baseScore - 5 + Math.random() * 10),
      industry: Math.round(80 + Math.random() * 15),
      culture: Math.round(75 + Math.random() * 15)
    },
    highlights: [
      `核心技能匹配度高：${matched.slice(0, 3).join('、')}等关键技能符合要求`,
      '具备完整的B端产品设计经验，熟悉SaaS产品流程',
      '有Design System建设经验，能够统一产品规范'
    ],
    summary: `该候选人与岗位整体匹配度良好。在${matched.slice(0, 3).join('、')}等方面与职位要求高度契合。具备2年+B端产品设计经验，主导过后台框架重构和Design System建设项目，有明确的数据成果（SKU创建效率提升50%）。建议优先考虑。`,
    matchedKeywords: matched.slice(0, 8),
    missingKeywords: missing.length > 0 ? missing : ['无显著缺失']
  };
}

// 显示结果
function displayResult(result) {
  // 总分
  document.getElementById('totalScore').textContent = result.totalScore;
  const statusEl = document.getElementById('scoreStatus');
  if (result.totalScore >= 80) {
    statusEl.textContent = '高度匹配';
    statusEl.className = 'score-status high';
  } else if (result.totalScore >= 60) {
    statusEl.textContent = '较为匹配';
    statusEl.className = 'score-status medium';
  } else {
    statusEl.textContent = '匹配度低';
    statusEl.className = 'score-status low';
  }
  
  // 维度评分
  const dimGrid = document.getElementById('dimensionsGrid');
  const dimNames = { skill: '技能匹配', experience: '经验匹配', industry: '行业匹配', culture: '文化匹配' };
  dimGrid.innerHTML = Object.entries(result.dimensions).map(([key, score]) => `
    <div class="dimension-item">
      <div class="dimension-header">
        <span class="dimension-name">${dimNames[key]}</span>
        <span class="dimension-score">${score}分</span>
      </div>
      <div class="dimension-bar">
        <div class="dimension-fill" style="width: ${score}%"></div>
      </div>
    </div>
  `).join('');
  
  // 亮点
  document.getElementById('highlightList').innerHTML = result.highlights.map(h => `<li>${h}</li>`).join('');
  
  // 总结
  document.getElementById('summaryText').textContent = result.summary;
  
  // 关键词
  document.getElementById('matchedKeywords').innerHTML = result.matchedKeywords.map(k => 
    `<span class="keyword-tag matched">${k}</span>`
  ).join('');
  document.getElementById('missingKeywords').innerHTML = result.missingKeywords.map(k => 
    `<span class="keyword-tag missing">${k}</span>`
  ).join('');
  
  // 显示结果
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 导出功能
function exportAsImage() {
  alert('导出图片功能需要引入 html2canvas 库\n请使用浏览器截图或复制报告内容');
}

function exportAsPDF() {
  alert('导出PDF功能需要引入 jsPDF 库\n请使用浏览器打印功能（Ctrl+P）保存为PDF');
}

function copyReport() {
  const result = {
    totalScore: document.getElementById('totalScore').textContent,
    summary: document.getElementById('summaryText').textContent
  };
  const text = `AI岗位匹配报告 - 马弘雅卉\n\n匹配度总分：${result.totalScore}分\n\n匹配总结：\n${result.summary}`;
  navigator.clipboard.writeText(text).then(() => alert('报告已复制到剪贴板'));
}

// 吸顶导航
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
  document.getElementById('backTop').style.opacity = window.scrollY > 600 ? '1' : '0';
  document.getElementById('backTop').style.transform = window.scrollY > 600 ? 'translateY(0)' : 'translateY(20px)';
});

// 淡入动画
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
